name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run lint
      - run: npm test

  build:
    # Build the xpi on every push/PR and publish it as a workflow artifact, so
    # any commit is installable without a local build. Releasing is a separate
    # job below — it runs only on version tags.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # manifest.json is the version source; the release name uses it.
      - name: Read version
        id: version
        run: |
          ver=$(node -p "require('./manifest.json').version")
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build xpi
        run: bash build.sh

      - name: Upload xpi artifact
        uses: actions/upload-artifact@v4
        with:
          name: ownspace-xpi
          path: ownspace.xpi
          if-no-files-found: error
          retention-days: 30

  release:
    # A tag like v1.2.3 publishes a GitHub Release with the xpi attached, so the
    # installable file lives next to its tag instead of only inside CI.
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build xpi
        run: bash build.sh

      - name: Read version
        id: version
        run: |
          ver=$(node -p "require('./manifest.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$ver" != "$tag" ]; then
            echo "::error::Tag '$tag' does not match manifest version '$ver'"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: OwnSpace ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: ownspace.xpi
