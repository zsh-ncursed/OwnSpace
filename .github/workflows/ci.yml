name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run lint
      - run: npm test

  build:
    # Build the xpi on every push/PR and publish it as a workflow artifact, so
    # any commit is installable without a local build. Releasing is a separate
    # job below — it runs only on version tags.
    runs-on: ubuntu-latest
    needs: test
    # The version bump step commits back to main, which needs write access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The bump step below pushes a commit back to main; it needs the
          # bot's own token to be allowed to.
          token: ${{ secrets.BOT_COMMIT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # AMO rejects a second submission of an already-uploaded version, so a
      # push that does not carry a version bump fails with "Conflict" at
      # signing. When this push already bumped the version, do nothing;
      # otherwise bump patch now so main is always publishable. The bot's own
      # commit re-triggers CI, which then sees an unchanged version and skips.
      - name: Ensure a publishable version
        id: version
        env:
          BOT_NAME: 'github-actions[bot]'
        run: |
          # The AMO side rejects a version it already signed, so the version in
          # the tree must be newer than the one published on the update channel.
          published=$(curl -fsSL https://github.com/${{ github.repository }}/releases/download/latest/update.json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).addons[Object.keys(JSON.parse(d).addons)[0]].updates.at(-1).version)}catch{console.log('')}})" || echo 'none')
          current=$(node -p "require('./manifest.json').version")
          echo "published: $published, tree: $current"
          if [ -n "$published" ] && [ "$published" != "none" ] && [ "$published" != "$current" ]; then
            echo "Version in the tree is ahead of the channel — no bump needed"
            echo "version=$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          next=$(node tools/bump-version.mjs)
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_NAME@users.noreply.github.com"
          git add manifest.json package.json
          git commit -m "chore: bump version to $next [skip ci]"
          git push
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build xpi
        run: bash build.sh

      # Sign with the AMO API so the update is accepted by a Firefox that
      # already runs a signed copy. AMO also embeds its own signature inside the
      # archive, so the hash below must be computed after signing. Skipped
      # entirely when the secrets are unset (key rotation, fork PRs) — the build
      # still publishes unsigned, which installs fine but will not update a
      # signed copy in place.
      - name: Sign with web-ext
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "AMO secrets not set — publishing unsigned build"
            exit 0
          fi
          npx web-ext sign \
            --config web-ext.config.mjs \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET" \
            --channel unlisted
          # web-ext writes the signed xpi to web-ext-artifacts/. Move it over
          # the unsigned build so every downstream step publishes one file.
          mv web-ext-artifacts/*.xpi ownspace.xpi

      - name: Upload xpi artifact
        uses: actions/upload-artifact@v4
        with:
          name: ownspace-xpi
          path: ownspace.xpi
          if-no-files-found: error
          retention-days: 30

  release:
    # Publish a GitHub Release with the xpi and update.json attached. Firefox
    # fetches the update channel over plain HTTPS, and a stable extension id
    # means browser.storage.local survives the update — no export/import dance.
    # A release per main push also gives "releases/latest/download/..." as a
    # URL that always points at the newest build.
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Download built xpi
        uses: actions/download-artifact@v4
        with:
          name: ownspace-xpi

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate update.json
        # Computed from the SIGNED xpi that just came down from the build job —
        # AMO embeds its own signature inside the archive, so the hash of the
        # unsigned build would not match and Firefox would refuse the update.
        run: bash tools/gen-update-json.sh

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          # Pin a moving "latest" release instead of versioned tags: it is the
          # stable URL Firefox's update_url points at, and it is re-cut on
          # every successful main build rather than only on version bumps.
          tag_name: latest
          name: OwnSpace latest (main)
          body: |
            Latest build of `main` — commit ${{ github.sha }}.

            Signed with AMO (unlisted channel). Install in Firefox:
            about:debugging → This Firefox → Load Temporary Add-on → pick
            `ownspace.xpi`. Firefox then applies later builds automatically:
            it polls `update.json` and updates in place, and since the
            extension id never changes, all widget data, settings and sync
            pairings carry over — no export/import needed.
          files: |
            ownspace.xpi
            update.json

  tag-release:
    # A version tag cuts a proper release keyed to that version, with a guard
    # against a tag/manifest mismatch.
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build xpi
        run: bash build.sh

      - name: Sign with web-ext
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          npx web-ext sign \
            --config web-ext.config.mjs \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET" \
            --channel unlisted
          mv web-ext-artifacts/*.xpi ownspace.xpi

      - name: Read version
        id: version
        run: |
          ver=$(node -p "require('./manifest.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$ver" != "$tag" ]; then
            echo "::error::Tag '$tag' does not match manifest version '$ver'"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Generate update.json
        run: bash tools/gen-update-json.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: OwnSpace ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ownspace.xpi
            update.json
