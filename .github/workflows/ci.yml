name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run lint
      - run: npm test

  build:
    # Build the xpi on every push/PR and publish it as a workflow artifact, so
    # any commit is installable without a local build. Releasing is a separate
    # job below — it runs only on version tags.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # manifest.json is the version source; the release name uses it.
      - name: Read version
        id: version
        run: |
          ver=$(node -p "require('./manifest.json').version")
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build xpi
        run: bash build.sh

      - name: Generate update.json
        # Firefox polls the update_url declared in the manifest. The xpi must be
        # downloadable over plain HTTPS, so both files land in main and are
        # served by raw.githubusercontent.com.
        run: bash tools/gen-update-json.sh

      - name: Upload xpi artifact
        uses: actions/upload-artifact@v4
        with:
          name: ownspace-xpi
          path: ownspace.xpi
          if-no-files-found: error
          retention-days: 30

  release:
    # Publish a GitHub Release with the xpi and update.json attached. Firefox
    # fetches the update channel over plain HTTPS, and a stable extension id
    # means browser.storage.local survives the update — no export/import dance.
    # A release per main push also gives "releases/latest/download/..." as a
    # URL that always points at the newest build.
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Download built xpi
        uses: actions/download-artifact@v4
        with:
          name: ownspace-xpi

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate update.json
        run: bash tools/gen-update-json.sh

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          # Pin a moving "latest" release instead of versioned tags: it is the
          # stable URL Firefox's update_url points at, and it is re-cut on
          # every successful main build rather than only on version bumps.
          tag_name: latest
          name: OwnSpace latest (main)
          body: |
            Latest build of `main` — commit ${{ github.sha }}.

            Install in Firefox: about:debugging → This Firefox → Load Temporary
            Add-on → pick `ownspace.xpi`. Updates are pulled automatically from
            `update.json` once Firefox polls the update URL.
          files: |
            ownspace.xpi
            update.json

  tag-release:
    # A version tag cuts a proper release keyed to that version, with a guard
    # against a tag/manifest mismatch.
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build xpi
        run: bash build.sh

      - name: Read version
        id: version
        run: |
          ver=$(node -p "require('./manifest.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$ver" != "$tag" ]; then
            echo "::error::Tag '$tag' does not match manifest version '$ver'"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Generate update.json
        run: bash tools/gen-update-json.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: OwnSpace ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ownspace.xpi
            update.json
