name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run lint
      - run: npm test

  build:
    # Build the xpi on every push/PR and publish it as a workflow artifact, so
    # any commit is installable without a local build. Releasing is a separate
    # job below — it runs only on version tags.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # manifest.json is the version source; the release name uses it.
      - name: Read version
        id: version
        run: |
          ver=$(node -p "require('./manifest.json').version")
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build xpi
        run: bash build.sh

      - name: Generate update.json
        # Firefox polls the update_url declared in the manifest. The xpi must be
        # downloadable over plain HTTPS, so both files land in main and are
        # served by raw.githubusercontent.com.
        run: bash tools/gen-update-json.sh

      - name: Upload xpi artifact
        uses: actions/upload-artifact@v4
        with:
          name: ownspace-xpi
          path: ownspace.xpi
          if-no-files-found: error
          retention-days: 30

  publish:
    # Commit the built xpi + update.json back to main. This is what makes
    # updates work: raw.githubusercontent.com/main/... is the update channel,
    # and a stable extension id means storage is untouched across updates.
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built xpi
        uses: actions/download-artifact@v4
        with:
          name: ownspace-xpi

      - name: Generate update.json
        run: bash tools/gen-update-json.sh

      - name: Commit release files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # keep the binary out of the diff noise when nothing changed
          if git status --porcelain ownspace.xpi update.json | grep -q .; then
            git add ownspace.xpi update.json
            git commit -m "build: publish ownspace.xpi and update.json [skip ci]"
            git push
          else
            echo "No changes to publish"
          fi

  release:
    # A tag like v1.2.3 publishes a GitHub Release with the xpi attached, so the
    # installable file lives next to its tag instead of only inside CI.
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build xpi
        run: bash build.sh

      - name: Read version
        id: version
        run: |
          ver=$(node -p "require('./manifest.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$ver" != "$tag" ]; then
            echo "::error::Tag '$tag' does not match manifest version '$ver'"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: OwnSpace ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: ownspace.xpi
